    <style>
      html { scroll-behavior: smooth; overflow-x: hidden; }
      body { font-family: "Heebo", sans-serif; background-color: #fafafa; color: #0f172a; overflow-x: hidden; }
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      @keyframes scrollRight { 0% { transform: translateX(-50%); } 100% { transform: translateX(0); } }
      @keyframes scrollLeft { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }
      .animate-scroll-right { animation: scrollRight 30s linear infinite; }
      .animate-scroll-left { animation: scrollLeft 30s linear infinite; }
      .pause-animation { animation-play-state: paused; }
      @keyframes wa-ping { 0% { transform: scale(1); opacity: 0.6; } 100% { transform: scale(2.2); opacity: 0; } }
      /* NagishLi: כפתור עגול (FAB) מתחת לוואטסאפ; מיקום סופי גם ב־nagishli-position-fix.js (התוסף דורס CSS) */
      nagishli#NagishLiTag #NagishLiBar {
        bottom: calc(0.75rem + env(safe-area-inset-bottom, 0px)) !important;
        left: calc(10px + env(safe-area-inset-left, 0px)) !important;
        right: auto !important;
        top: auto !important;
        z-index: 40 !important;
        width: auto !important;
        max-width: min(100vw - 3rem, 28rem) !important;
      }
      /* סגור: עיגול שחור, צל, אייקון כחול */
      nagishli#NagishLiTag #NagishLiBarStrip:not(.open) {
        width: 3.5rem !important;
        height: 3.5rem !important;
        min-width: 3.5rem !important;
        min-height: 3.5rem !important;
        padding: 0 !important;
        margin: 0 !important;
        border-radius: 50% !important;
        display: flex !important;
        align-items: center !important;
        justify-content: center !important;
        /* בלי זה ב־RTL האייקון נדחף; הספרייט נשאר עם 0 0 כמו בתוסף */
        direction: ltr !important;
        text-align: center !important;
        background: #000000 !important;
        box-shadow: 0 4px 18px rgba(0, 0, 0, 0.35) !important;
        border: none !important;
        text-shadow: none !important;
        box-sizing: border-box !important;
      }
      /* ספציפיות מלאה כמו בתוסף - כדי לדרוס margin-left:7px במצב קומפקטי */
      nagishli#NagishLiTag > #NagishLiBar > #NagishLiBarStrip:not(.open) > #NagishLiLogo {
        margin: 0 !important;
        margin-left: 0 !important;
        margin-right: 0 !important;
        width: 1.75rem !important;
        height: 1.75rem !important;
        min-width: 1.75rem !important;
        flex-shrink: 0 !important;
        align-self: center !important;
        display: block !important;
        flex: 0 0 auto !important;
        transform-origin: center center !important;
      }
      /* עברית: היפוך + צבע כחול; translate מתקן מרכוז אחרי scaleX והספרייט */
      nagishli[lang='he']#NagishLiTag > #NagishLiBar > #NagishLiBarStrip:not(.open) > #NagishLiLogo {
        transform: translate(-7px, -1px) scaleX(-1) !important;
        transform-origin: center center !important;
        filter: brightness(0) saturate(100%) invert(32%) sepia(98%) saturate(2000%) hue-rotate(200deg) brightness(1.05) contrast(1.05) !important;
      }
      /* פתוח: חזרה לפריסת התוסף */
      nagishli#NagishLiTag #NagishLiBarStrip.open {
        width: auto !important;
        height: auto !important;
        min-height: 0 !important;
        border-radius: 0 !important;
        display: block !important;
        padding: 10px !important;
        box-shadow: -1px -1px 0 #404040 inset, -1px -1px 0 #404040 !important;
      }
      nagishli#NagishLiTag #NagishLiBarStrip.open #NagishLiLogo {
        filter: none !important;
      }
      /* וואטסאפ בפינה הימנית התחתונה */
      a.floating-whatsapp {
        bottom: calc(1.25rem + env(safe-area-inset-bottom, 0px)) !important;
        left: auto !important;
        right: calc(1.25rem + env(safe-area-inset-right, 0px)) !important;
        z-index: 50 !important;
      }
